*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}

.adm{display:grid;grid-template-columns:1fr;gap:16px;padding:20px 0 40px}

.side nav{display:none;flex-direction:column;gap:4px}.side nav.open{display:flex}@media(min-width:900px){.side nav{display:flex}}

.panel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;min-width:0}.panel h2{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
